name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Same engine as Neon; integration tests use it via DATABASE_URL.
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: skillup
          POSTGRES_PASSWORD: skillup
          POSTGRES_DB: skillup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillup" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://skillup:skillup@localhost:5432/skillup
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run pyright

      - name: Tests
        # Exit code 5 means "no tests collected", which is fine while the repo is empty.
        run: uv run pytest --cov --cov-report=xml || [ $? -eq 5 ]

      - name: Coverage on changed lines (80%)
        if: github.event_name == 'pull_request' && hashFiles('coverage.xml') != ''
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

      - name: Traceability
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          args=(--results reports/req-results.json)
          if [ -n "$BASE" ]; then args+=(--base "$BASE" --pr-title "$PR_TITLE" --branch "$BRANCH"); fi
          uv run python -m scripts.check_traceability "${args[@]}"

      - name: Cost guardrails
        run: uv run python -m scripts.check_cost_guardrails

      - name: Dependency audit
        run: |
          mkdir -p reports
          uv export --all-groups --no-hashes --no-emit-project --format requirements-txt > reports/requirements.txt
          uv run pip-audit --strict --disable-pip --no-deps -r reports/requirements.txt

      - name: bq-model is untouched
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'bq-model-change')
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --name-only "$BASE...HEAD" | grep -q '^bq-model/'; then
            echo "::error::This PR changes bq-model/, a live service. The owner must add the 'bq-model-change' label."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            reports/
            coverage.xml
          if-no-files-found: ignore

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.17"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
