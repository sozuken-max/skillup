version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
# bq-model/ is deliberately not listed: it's a live service changed only by the owner.
